global:
  scrape_interval: 15s

# Targets are discovered through the Docker socket rather than DNS. Swarm
# service discovery is what supplies the node each task runs on, and Cetacean
# selects node series with instance=~"<node address>:.*" — see
# instanceSelector in internal/mcp/metrics.go and buildInstanceFilter in
# frontend/src/lib/prometheusParser.ts. Scraping over an overlay network
# without relabeling leaves instance set to the task's overlay IP, which
# matches no node, and every node chart comes back empty.
scrape_configs:
  - job_name: 'cadvisor'
    dockerswarm_sd_configs:
      - host: unix:///var/run/docker.sock
        role: tasks
        port: 8080
    relabel_configs:
      # Match any stack namespace, so `docker stack deploy -c
      # compose.monitoring.yaml <name>` works under any name.
      - source_labels: [__meta_dockerswarm_service_name]
        regex: .*cadvisor
        action: keep
      - source_labels: [__meta_dockerswarm_task_desired_state]
        regex: running
        action: keep
      # __address__ stays the task's overlay IP, which is what is reachable;
      # only the instance label is rewritten to the node Cetacean knows.
      - source_labels: [__meta_dockerswarm_node_address]
        target_label: instance
        replacement: ${1}:8080
      - source_labels: [__meta_dockerswarm_node_hostname]
        target_label: node_hostname

  - job_name: 'node-exporter'
    dockerswarm_sd_configs:
      - host: unix:///var/run/docker.sock
        role: tasks
        port: 9100
    relabel_configs:
      - source_labels: [__meta_dockerswarm_service_name]
        regex: .*node-exporter
        action: keep
      - source_labels: [__meta_dockerswarm_task_desired_state]
        regex: running
        action: keep
      - source_labels: [__meta_dockerswarm_node_address]
        target_label: instance
        replacement: ${1}:9100
      - source_labels: [__meta_dockerswarm_node_hostname]
        target_label: node_hostname
