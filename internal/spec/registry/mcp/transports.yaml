# Hand-written: the Streamable HTTP transport's own security rules, which the
# conformance suite drives from src/scenarios/server/dns-rebinding.ts rather
# than from a SEP requirement file. scripts/spec-genmcp does not touch this.

source: MCP Streamable HTTP transport
title: Security & Endpoint
revision: draft
reviewed: 2026-09-16
url:
  - https://modelcontextprotocol.io/specification/draft/basic/transports/streamable-http#security--endpoint
  - https://github.com/modelcontextprotocol/modelcontextprotocol/blob/main/docs/specification/draft/basic/transports/streamable-http.mdx

inventory:
  from: >-
    The three numbered statements under "Security & Endpoint"; the two
    addressed to the Origin header.
  count: 2

requirements:
  - id: origin-validated-on-every-connection
    level: MUST
    text: >-
      Servers MUST validate the Origin header on all incoming connections to
      prevent DNS rebinding attacks.
    url: https://modelcontextprotocol.io/specification/draft/basic/transports/streamable-http#security--endpoint
    deferred: >-
      The guard reads server.cors.origins alone, so a deployment that names
      only server.public_url refuses a browser client at its own origin too.
      The CSRF guard trusts that setting and this one does not.

  - id: invalid-origin-refused-with-403
    level: MUST
    text: >-
      If the Origin header is present and invalid, servers MUST respond with
      HTTP 403 Forbidden. The HTTP response body MAY comprise a JSON-RPC error
      response that has no id.
    url: https://modelcontextprotocol.io/specification/draft/basic/transports/streamable-http#security--endpoint
    discriminator: origin
