# Hand-written: the Streamable HTTP transport's own security rules, which the
# conformance suite drives from src/scenarios/server/dns-rebinding.ts rather
# than from a SEP requirement file. scripts/spec-genmcp does not touch this.

source: MCP Streamable HTTP transport
title: Security & Endpoint
revision: "2026-07-28"
reviewed: 2026-10-24
url:
  - https://modelcontextprotocol.io/specification/2026-07-28/basic/transports/streamable-http#security--endpoint
  - https://github.com/modelcontextprotocol/modelcontextprotocol/blob/dae694f61a31f7a3ec2af3aff709e11f70f61e48/docs/specification/2026-07-28/basic/transports/streamable-http.mdx

inventory:
  from: >-
    The three numbered statements under "Security & Endpoint", the first with
    the Origin rule nested under it.
  count: 4

requirements:
  - id: origin-validated-on-every-connection
    level: MUST
    lane: e2e
    text: >-
      Servers MUST validate the Origin header on all incoming connections to
      prevent DNS rebinding attacks.
    url: https://modelcontextprotocol.io/specification/2026-07-28/basic/transports/streamable-http#security--endpoint

  - id: invalid-origin-refused-with-403
    level: MUST
    lane: e2e
    text: >-
      If the Origin header is present and invalid, servers MUST respond with
      HTTP 403 Forbidden. The HTTP response body MAY comprise a JSON-RPC error
      response that has no id.
    url: https://modelcontextprotocol.io/specification/2026-07-28/basic/transports/streamable-http#security--endpoint

dismissed:
  local-servers-bind-to-localhost: >-
    Addressed to a server running locally beside its client. Cetacean runs as a
    Swarm service reached over the network, and where it listens is the
    deployment's server.listen_addr.
  connections-authenticated: >-
    Whether /mcp authenticates is the deployment's auth.mode. Mode none is a
    supported choice for a deployment whose proxy authenticates in front of it,
    so the server cannot hold every connection to it.
