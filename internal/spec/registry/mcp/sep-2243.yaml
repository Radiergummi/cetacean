  - id: header-name-case-insensitive
    level: MUST
    text: >-
      Clients and servers MUST use case-insensitive comparisons for header names.
    url:
      - https://modelcontextprotocol.io/specification/draft/basic/transports#standard-mcp-request-headers
      - https://raw.githubusercontent.com/modelcontextprotocol/conformance/7169291ec0b68eb370fddcd9947313ab0d5e4156/src/seps/sep-2243.yaml

  - id: server-reject-invalid-headers
    level: MUST
    text: >-
      Servers that process the request body MUST reject requests with mismatched or
      missing standard-header values, returning HTTP 400 Bad Request.
    url:
      - https://modelcontextprotocol.io/specification/draft/basic/transports#standard-mcp-request-headers
      - https://raw.githubusercontent.com/modelcontextprotocol/conformance/7169291ec0b68eb370fddcd9947313ab0d5e4156/src/seps/sep-2243.yaml

  - id: server-reject-error-code
    level: SHOULD
    text: >-
      When rejecting a request due to header validation failure, servers SHOULD include
      a JSON-RPC error response using error code -32020.
    url:
      - https://modelcontextprotocol.io/specification/draft/basic/transports#standard-mcp-request-headers
      - https://raw.githubusercontent.com/modelcontextprotocol/conformance/7169291ec0b68eb370fddcd9947313ab0d5e4156/src/seps/sep-2243.yaml

