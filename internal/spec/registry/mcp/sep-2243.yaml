requirements:
  - id: header-name-case-insensitive
    level: MUST
    lane: e2e
    text: >-
      Clients and servers MUST use case-insensitive comparisons for header names.
    url:
      - https://modelcontextprotocol.io/specification/2026-07-28/basic/transports/streamable-http#case-sensitivity
      - https://raw.githubusercontent.com/modelcontextprotocol/conformance/c37eec888e1c6ff140af79987a40008548b7cc5f/src/seps/sep-2243.yaml

  - id: server-reject-invalid-headers
    level: MUST
    lane: e2e
    text: >-
      Servers that process the request body MUST reject requests where the values
      specified in the headers do not match the corresponding values in the request
      body. [...] Validation failure conditions include: A required standard header
      (MCP-Protocol-Version, Mcp-Method, Mcp-Name) is missing.
    url:
      - https://modelcontextprotocol.io/specification/2026-07-28/basic/transports/streamable-http#server-validation
      - https://raw.githubusercontent.com/modelcontextprotocol/conformance/c37eec888e1c6ff140af79987a40008548b7cc5f/src/seps/sep-2243.yaml

  - id: server-reject-error-code
    level: MUST
    lane: e2e
    text: >-
      When rejecting a request due to header validation failure, servers MUST return
      HTTP status 400 Bad Request and MUST include a JSON-RPC error response using the
      following error code: [-32020, HeaderMismatch]
    url:
      - https://modelcontextprotocol.io/specification/2026-07-28/basic/transports/streamable-http#server-validation
      - https://raw.githubusercontent.com/modelcontextprotocol/conformance/c37eec888e1c6ff140af79987a40008548b7cc5f/src/seps/sep-2243.yaml

