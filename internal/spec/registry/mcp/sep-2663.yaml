requirements:
  - id: server-rejects-undeclared-client
    level: MUST
    text: >-
      A server MUST NOT return CreateTaskResult to a client that did not include the
      extension capability on its request, regardless of prior declarations.
    url:
      - https://github.com/modelcontextprotocol/ext-tasks/blob/b3d28aceaa6d49f5f92258e3d06b61ad6f111e84/specification/2026-07-28/tasks.md#capability-negotiation
      - https://raw.githubusercontent.com/modelcontextprotocol/conformance/c37eec888e1c6ff140af79987a40008548b7cc5f/src/seps/sep-2663.yaml
    deferred: >-
      Task creation follows 2025-11-25's opt-in: a tools/call carrying params.task gets
      a CreateTaskResult whether or not the request declares the extension. mcp-go
      v1.3.0 has no server-directed task creation to hang the extension's rule on.

  - id: result-type-task-on-create
    level: MUST
    text: >-
      Servers MUST set resultType to "task" when returning a CreateTaskResult so that
      clients can distinguish it from a standard result.
    url:
      - https://github.com/modelcontextprotocol/ext-tasks/blob/b3d28aceaa6d49f5f92258e3d06b61ad6f111e84/specification/2026-07-28/tasks.md#polymorphic-results
      - https://raw.githubusercontent.com/modelcontextprotocol/conformance/c37eec888e1c6ff140af79987a40008548b7cc5f/src/seps/sep-2663.yaml
    deferred: >-
      mcp-go v1.3.0 stamps resultType complete on every result it writes,
      CreateTaskResult included.

  - id: no-task-result-type-on-others
    level: MUST
    text: >-
      Servers MUST NOT set resultType to "task" on result types other than
      CreateTaskResult.
    url:
      - https://github.com/modelcontextprotocol/ext-tasks/blob/b3d28aceaa6d49f5f92258e3d06b61ad6f111e84/specification/2026-07-28/tasks.md#polymorphic-results
      - https://raw.githubusercontent.com/modelcontextprotocol/conformance/c37eec888e1c6ff140af79987a40008548b7cc5f/src/seps/sep-2663.yaml

  - id: failed-status-jsonrpc-only
    level: MUST
    text: >-
      failed: The request failed due to a JSON-RPC error during execution. The task will
      include the error field with the JSON-RPC error details. This status MUST NOT be
      used for non-JSON-RPC errors.
    url:
      - https://github.com/modelcontextprotocol/ext-tasks/blob/b3d28aceaa6d49f5f92258e3d06b61ad6f111e84/specification/2026-07-28/tasks.md#task-status
      - https://raw.githubusercontent.com/modelcontextprotocol/conformance/c37eec888e1c6ff140af79987a40008548b7cc5f/src/seps/sep-2663.yaml
    deferred: >-
      A tool error on a task-augmented call is returned as a Go error, so mcp-go marks
      the task failed rather than completed. Completed would read as an applied
      mutation, since mcp-go v1.3.0's tasks/get carries no result to show the isError
      in.

  - id: durable-create-strong-consistency
    level: MUST
    text: >-
      A server MUST NOT return CreateTaskResult until the task is durably created —
      that is, until a tasks/get for the returned taskId would resolve. In
      eventually-consistent environments, the server MUST wait for consistency before
      responding.
    url:
      - https://github.com/modelcontextprotocol/ext-tasks/blob/b3d28aceaa6d49f5f92258e3d06b61ad6f111e84/specification/2026-07-28/tasks.md#task-creation
      - https://raw.githubusercontent.com/modelcontextprotocol/conformance/c37eec888e1c6ff140af79987a40008548b7cc5f/src/seps/sep-2663.yaml

  - id: tasks-get-status-working
    level: MUST
    text: >-
