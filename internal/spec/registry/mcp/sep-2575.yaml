requirements:
  - id: server-rejects-undeclared-capability
    level: MUST
    text: >-
      A server MUST NOT rely on capabilities the client has not declared. If processing
      a request requires a capability the client did not include in
      io.modelcontextprotocol/clientCapabilities, the server MUST return a
      MissingRequiredClientCapabilityError (-32021).
    url:
      - https://modelcontextprotocol.io/specification/draft/basic/index#meta
      - https://raw.githubusercontent.com/modelcontextprotocol/conformance/7169291ec0b68eb370fddcd9947313ab0d5e4156/src/seps/sep-2575.yaml

  - id: missing-capability-http-400
    level: MUST
    text: >-
      On HTTP, the response status MUST be 400 Bad Request [for
      MissingRequiredClientCapabilityError].
    url:
      - https://modelcontextprotocol.io/specification/draft/basic/index#meta
      - https://raw.githubusercontent.com/modelcontextprotocol/conformance/7169291ec0b68eb370fddcd9947313ab0d5e4156/src/seps/sep-2575.yaml

  - id: server-tags-subscription-id
    level: MUST
    text: >-
      On notifications delivered via a subscriptions/listen stream, the server MUST
      include io.modelcontextprotocol/subscriptionId in _meta so the client can
      correlate the notification with the originating subscription request.
    url:
      - https://modelcontextprotocol.io/specification/draft/basic/index#meta
      - https://raw.githubusercontent.com/modelcontextprotocol/conformance/7169291ec0b68eb370fddcd9947313ab0d5e4156/src/seps/sep-2575.yaml

  - id: server-unsupported-version-error
    level: MUST
    text: >-
      If the server does not implement the requested version (whether the version is
      unknown to the server, or is a known version the server has chosen not to
      support), it MUST respond with an UnsupportedProtocolVersionError listing the
      versions it does support.
    url:
      - https://modelcontextprotocol.io/specification/draft/basic/lifecycle#protocol-version-negotiation
      - https://raw.githubusercontent.com/modelcontextprotocol/conformance/7169291ec0b68eb370fddcd9947313ab0d5e4156/src/seps/sep-2575.yaml

  - id: server-implements-discover
    level: MUST
    text: >-
      Servers MUST implement server/discover.
    url:
      - https://modelcontextprotocol.io/specification/draft/server/discover
      - https://raw.githubusercontent.com/modelcontextprotocol/conformance/7169291ec0b68eb370fddcd9947313ab0d5e4156/src/seps/sep-2575.yaml

  - id: http-server-no-independent-requests-on-stream
    level: MUST
    text: >-
      The server MUST NOT send independent JSON-RPC requests on this stream.
      Server-to-client interactions are embedded as input requests inside an
      IncompleteResult.
    url:
      - https://modelcontextprotocol.io/specification/draft/basic/transports#receiving-messages-1
      - https://raw.githubusercontent.com/modelcontextprotocol/conformance/7169291ec0b68eb370fddcd9947313ab0d5e4156/src/seps/sep-2575.yaml
    gap: >-
      The stream lane reads notifications and never asserts that nothing else arrives on
      the stream.

  - id: http-server-header-mismatch-400
    level: MUST
    text: >-
      If the values do not match, the server MUST reject the request with 400 Bad
      Request and a HeaderMismatch JSON-RPC error.
    url:
      - https://modelcontextprotocol.io/specification/draft/basic/transports#protocol-version-header
      - https://raw.githubusercontent.com/modelcontextprotocol/conformance/7169291ec0b68eb370fddcd9947313ab0d5e4156/src/seps/sep-2575.yaml

  - id: http-server-unsupported-version-400
    level: MUST
    text: >-
      If the server does not implement the requested protocol version, it MUST respond
      with 400 Bad Request and an UnsupportedProtocolVersionError listing its supported
      versions.
    url:
      - https://modelcontextprotocol.io/specification/draft/basic/transports#protocol-version-header
      - https://raw.githubusercontent.com/modelcontextprotocol/conformance/7169291ec0b68eb370fddcd9947313ab0d5e4156/src/seps/sep-2575.yaml

  - id: http-server-method-not-found-404
    level: MUST
    text: >-
      If the server does not implement the requested RPC method, it MUST respond with
      404 Not Found and a JSON-RPC error with code -32601 (Method not found).
    url:
      - https://modelcontextprotocol.io/specification/draft/basic/transports#protocol-version-header
      - https://raw.githubusercontent.com/modelcontextprotocol/conformance/7169291ec0b68eb370fddcd9947313ab0d5e4156/src/seps/sep-2575.yaml

  - id: server-honors-notification-filter
    level: MUST
    text: >-
      The server MUST NOT send notification types the client has not explicitly
      requested.
    url:
      - https://modelcontextprotocol.io/specification/draft/basic/utilities/subscriptions#opening-a-stream
      - https://raw.githubusercontent.com/modelcontextprotocol/conformance/7169291ec0b68eb370fddcd9947313ab0d5e4156/src/seps/sep-2575.yaml

  - id: server-sends-subscription-ack
    level: MUST
    text: >-
      The server MUST send notifications/subscriptions/acknowledged as the first message
      on the stream.
    url:
      - https://modelcontextprotocol.io/specification/draft/basic/utilities/subscriptions#acknowledgment
      - https://raw.githubusercontent.com/modelcontextprotocol/conformance/7169291ec0b68eb370fddcd9947313ab0d5e4156/src/seps/sep-2575.yaml

  - id: server-declares-prompts-in-discover
    level: MUST
    text: >-
      Servers that support prompts MUST declare the prompts capability in their
      DiscoverResult.
    url:
      - https://modelcontextprotocol.io/specification/draft/server/prompts#capabilities
      - https://raw.githubusercontent.com/modelcontextprotocol/conformance/7169291ec0b68eb370fddcd9947313ab0d5e4156/src/seps/sep-2575.yaml

