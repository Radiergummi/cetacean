requirements:
  - id: server-rejects-undeclared-capability
    level: MUST
    lane: e2e
    text: >-
      A server MUST NOT rely on capabilities the client has not declared. If processing
      a request requires a capability the client did not include in
      io.modelcontextprotocol/clientCapabilities, the server MUST return a
      MissingRequiredClientCapabilityError (-32021) whose data.requiredCapabilities
      lists the missing capabilities.
    url:
      - https://modelcontextprotocol.io/specification/2026-07-28/basic/index#_meta
      - https://raw.githubusercontent.com/modelcontextprotocol/conformance/c37eec888e1c6ff140af79987a40008548b7cc5f/src/seps/sep-2575.yaml

  - id: missing-capability-http-400
    level: MUST
    lane: e2e
    text: >-
      On HTTP, the response status MUST be 400 Bad Request.
    url:
      - https://modelcontextprotocol.io/specification/2026-07-28/basic/index#_meta
      - https://raw.githubusercontent.com/modelcontextprotocol/conformance/c37eec888e1c6ff140af79987a40008548b7cc5f/src/seps/sep-2575.yaml

  - id: server-tags-subscription-id
    level: MUST
    lane: e2e
    text: >-
      On notifications delivered via a subscriptions/listen stream, the server MUST
      include io.modelcontextprotocol/subscriptionId in _meta so the client can
      correlate the notification with the originating subscription request.
    url:
      - https://modelcontextprotocol.io/specification/2026-07-28/basic/index#_meta
      - https://raw.githubusercontent.com/modelcontextprotocol/conformance/c37eec888e1c6ff140af79987a40008548b7cc5f/src/seps/sep-2575.yaml

  - id: server-unsupported-version-error
    level: MUST
    lane: e2e
    text: >-
      If the server does not implement the requested version (whether the version is
      unknown to the server, or is a known version the server has chosen not to
      support), it MUST respond with an UnsupportedProtocolVersionError listing the
      versions it does support:
    url:
      - https://modelcontextprotocol.io/specification/2026-07-28/basic/versioning#protocol-version-negotiation
      - https://raw.githubusercontent.com/modelcontextprotocol/conformance/c37eec888e1c6ff140af79987a40008548b7cc5f/src/seps/sep-2575.yaml

  - id: server-implements-discover
    level: MUST
    lane: e2e
    text: >-
      Servers MUST implement server/discover.
    url:
      - https://modelcontextprotocol.io/specification/2026-07-28/basic/versioning#protocol-version-negotiation
      - https://raw.githubusercontent.com/modelcontextprotocol/conformance/c37eec888e1c6ff140af79987a40008548b7cc5f/src/seps/sep-2575.yaml

  - id: http-server-no-independent-requests-on-stream
    level: MUST
    text: >-
      The server MUST NOT send independent JSON-RPC requests on this stream.
      Server-to-client interactions (sampling, elicitation, list-roots) are embedded as
      input requests inside an InputRequiredResult [per the multi round-trip pattern],
      not delivered as separate requests on this or any other stream.
    url:
      - https://modelcontextprotocol.io/specification/2026-07-28/basic/transports/streamable-http#receiving-messages
      - https://raw.githubusercontent.com/modelcontextprotocol/conformance/c37eec888e1c6ff140af79987a40008548b7cc5f/src/seps/sep-2575.yaml
    gap: >-
      The stream lane reads notifications and never asserts that nothing else arrives on
      the stream.

  - id: http-server-header-mismatch-400
    level: MUST
    lane: e2e
    text: >-
      If the values do not match, the server MUST reject the request with 400 Bad
      Request and a HeaderMismatch JSON-RPC error (see Server Validation).
    url:
      - https://modelcontextprotocol.io/specification/2026-07-28/basic/transports/streamable-http#protocol-version-header
      - https://raw.githubusercontent.com/modelcontextprotocol/conformance/c37eec888e1c6ff140af79987a40008548b7cc5f/src/seps/sep-2575.yaml

  - id: http-server-unsupported-version-400
    level: MUST
    lane: e2e
    text: >-
      If the server does not implement the requested protocol version (whether the
      version is unknown to the server, or is a known version the server has chosen not
      to support), it MUST respond with 400 Bad Request and an
      UnsupportedProtocolVersionError listing its supported versions.
    url:
      - https://modelcontextprotocol.io/specification/2026-07-28/basic/transports/streamable-http#protocol-version-header
      - https://raw.githubusercontent.com/modelcontextprotocol/conformance/c37eec888e1c6ff140af79987a40008548b7cc5f/src/seps/sep-2575.yaml

  - id: http-server-method-not-found-404
    level: MUST
    lane: e2e
    text: >-
      If the server does not implement the requested RPC method, it MUST respond with
      404 Not Found and a JSON-RPC error with code -32601 (Method not found).
    url:
      - https://modelcontextprotocol.io/specification/2026-07-28/basic/transports/streamable-http#protocol-version-header
      - https://raw.githubusercontent.com/modelcontextprotocol/conformance/c37eec888e1c6ff140af79987a40008548b7cc5f/src/seps/sep-2575.yaml

  - id: server-honors-notification-filter
    level: MUST
    lane: e2e
    text: >-
      The server MUST NOT send notification types the client has not explicitly
      requested.
    url:
      - https://modelcontextprotocol.io/specification/2026-07-28/basic/patterns/subscriptions#opening-a-stream
      - https://raw.githubusercontent.com/modelcontextprotocol/conformance/c37eec888e1c6ff140af79987a40008548b7cc5f/src/seps/sep-2575.yaml

  - id: server-sends-subscription-ack
    level: MUST
    lane: e2e
    text: >-
      The server MUST send notifications/subscriptions/acknowledged as the first message
      carrying the subscription's ID in _meta under
      io.modelcontextprotocol/subscriptionId, and MUST NOT send any notification on the
      subscription before it.
    url:
      - https://modelcontextprotocol.io/specification/2026-07-28/basic/patterns/subscriptions#acknowledgment
      - https://raw.githubusercontent.com/modelcontextprotocol/conformance/c37eec888e1c6ff140af79987a40008548b7cc5f/src/seps/sep-2575.yaml

  - id: server-declares-prompts-in-discover
    level: MUST
    lane: e2e
    text: >-
      Servers that support prompts MUST declare the prompts capability in their
      DiscoverResult:
    url:
      - https://modelcontextprotocol.io/specification/2026-07-28/server/prompts#capabilities
      - https://raw.githubusercontent.com/modelcontextprotocol/conformance/c37eec888e1c6ff140af79987a40008548b7cc5f/src/seps/sep-2575.yaml

