requirements:
  - id: consumers-ignore-unrecognized-fields
    level: MUST
    text: >-
      Consumers MUST ignore unrecognized fields unless otherwise noted.
    url: https://slsa.dev/spec/v1.0/provenance#parsing-rules

  - id: unset-null-empty-equivalent
    level: MUST
    text: >-
      Unset, null, and empty field values MUST be interpreted equivalently.
    url: https://slsa.dev/spec/v1.0/provenance#parsing-rules
