source: RFC 8414
title: OAuth 2.0 Authorization Server Metadata
reviewed: 2026-09-17
url: https://www.rfc-editor.org/rfc/rfc8414

inventory:
  from: >-
    RFC 8414 §2's REQUIRED and RECOMMENDED members and the conditional MUSTs
    attached to any member, §2.1, and §3, §3.1, §3.2, §3.3 and §4 in full. The
    bare OPTIONAL declarations are excluded: they bind nothing. §6 is excluded
    too — its statements bind the client's TLS stack and the deployment's
    transport, neither of which is this server's code.
  count: 41

requirements:
  - id: issuer-required
    level: MUST
    text: >-
      REQUIRED. The authorization server's issuer identifier, which is a URL
      that uses the "https" scheme and has no query or fragment components.
    url: https://www.rfc-editor.org/rfc/rfc8414#section-2
    mutants:
      - file: internal/oauth/server.go
        replace: "\t\tIssuer:                base,"
        with: "\t\tIssuer:                \"\","

  - id: authorization-endpoint-required
    level: MUST
    text: >-
      URL of the authorization server's authorization endpoint [RFC6749]. This
      is REQUIRED unless no grant types are supported that use the
      authorization endpoint.
    url: https://www.rfc-editor.org/rfc/rfc8414#section-2
    mutants:
      - file: internal/oauth/server.go
        replace: "\t\tAuthorizationEndpoint: base + \"/oauth/authorize\","
        with: "\t\tAuthorizationEndpoint: \"\","

  - id: token-endpoint-required
    level: MUST
    text: >-
      URL of the authorization server's token endpoint [RFC6749]. This is
      REQUIRED unless only the implicit grant type is supported.
    url: https://www.rfc-editor.org/rfc/rfc8414#section-2
    mutants:
      - file: internal/oauth/server.go
        replace: "\t\tTokenEndpoint:         base + \"/oauth/token\","
        with: "\t\tTokenEndpoint:         \"\","

  - id: response-types-supported-required
    level: MUST
    text: >-
      REQUIRED. JSON array containing a list of the OAuth 2.0 "response_type"
      values that this authorization server supports.
    url: https://www.rfc-editor.org/rfc/rfc8414#section-2
    mutants:
      - file: internal/oauth/server.go
        replace: "\t\tResponseTypesSupported:                 []string{\"code\"},"
        with: "\t\tResponseTypesSupported:                 nil,"

  - id: scopes-supported-recommended
    level: SHOULD
    text: >-
      RECOMMENDED. JSON array containing a list of the OAuth 2.0 [RFC6749]
      "scope" values that this authorization server supports.
    url: https://www.rfc-editor.org/rfc/rfc8414#section-2

  - id: document-at-well-known-path
    level: MUST
    text: >-
      Authorization servers supporting metadata MUST make a JSON document
      containing metadata as specified in Section 2 available at a path formed
      by inserting a well-known URI string into the authorization server's
      issuer identifier between the host component and the path component, if
      any. By default, the well-known URI string used is
      "/.well-known/oauth-authorization-server".
    url: https://www.rfc-editor.org/rfc/rfc8414#section-3
    mutants:
      - file: internal/oauth/server.go
        replace: "\tconst asMetadataPath = \"/.well-known/oauth-authorization-server\""
        with: "\tconst asMetadataPath = \"/.well-known/oauth-as-metadata\""

  - id: queried-with-get
    level: MUST
    text: >-
      An authorization server metadata document MUST be queried using an HTTP
      "GET" request at the previously specified path.
    url: https://www.rfc-editor.org/rfc/rfc8414#section-3.1
    mutants:
      - file: internal/oauth/server.go
        replace: "\tmux.HandleFunc(\"GET \"+asMetadataPath+s.cfg.BasePath, s.HandleMetadata)"
        with: "\tmux.HandleFunc(asMetadataPath+s.cfg.BasePath, s.HandleMetadata)"

  - id: well-known-segment-precedes-the-path-component
    level: MUST
    text: >-
      If the issuer identifier value contains a path component, any terminating
      "/" MUST be removed before inserting "/.well-known/" and the well-known
      URI suffix between the host component and the path component.
    url: https://www.rfc-editor.org/rfc/rfc8414#section-3.1
    mutants:
      - file: internal/oauth/server.go
        replace: "\treturn c.Issuer + c.BasePath"
        with: "\treturn c.Issuer"

  - id: response-is-200-json
    level: MUST
    text: >-
      A successful response MUST use the 200 OK HTTP status code and return a
      JSON object using the "application/json" content type that contains a set
      of claims as its members that are a subset of the metadata values defined
      in Section 2.
    url: https://www.rfc-editor.org/rfc/rfc8414#section-3.2
    mutants:
      - file: internal/oauth/server.go
        replace: "\twriteDiscoveryDoc(w, doc, \"application/json\")"
        with: "\twriteDiscoveryDoc(w, doc, \"text/plain\")"

  - id: zero-element-claims-omitted
    level: MUST
    text: >-
      Claims with zero elements MUST be omitted from the response.
    url: https://www.rfc-editor.org/rfc/rfc8414#section-3.2
    deferred: >-
      Both discovery documents emit an empty scopes_supported rather than
      omitting it. This server defines no scopes, and an absent field reads as
      "unspecified" where an empty array answers the question — a client that
      consults it sends no scope instead of guessing at one. Knowingly outside
      §3.2, and pinned so that omitting the field becomes a decision.

  - id: issuer-matches-the-retrieval-url
    level: MUST
    text: >-
      The "issuer" value returned MUST be identical to the authorization
      server's issuer identifier value into which the well-known URI string was
      inserted to create the URL used to retrieve the metadata.
    url: https://www.rfc-editor.org/rfc/rfc8414#section-3.3
    mutants:
      - file: internal/oauth/server.go
        replace: "\t\tIssuer:                base,\n\t\tAuthorizationEndpoint: base + \"/oauth/authorize\","
        with: "\t\tIssuer:                base + \"/\",\n\t\tAuthorizationEndpoint: base + \"/oauth/authorize\","

dismissed:
  jwks-uri-https-scheme: >-
    The JWK Set URL is built from the configured issuer, so its scheme is the
    deployment's. A local deployment on http://localhost is supported
    deliberately; the scheme is configuration, not a code path.
  jwks-set-may-carry-encryption-keys: >-
    A MAY. This server publishes one signing key and accepts no encrypted
    requests.
  jwks-use-parameter-required: >-
    Conditional on publishing both signing and encryption keys. This server
    publishes signing keys alone, so the condition never holds.
  scopes-may-be-withheld: >-
    A MAY about advertising fewer scopes than are supported. This server
    defines none, so there is nothing to withhold.
  token-endpoint-auth-signing-alg-present: >-
    Conditional on offering private_key_jwt or client_secret_jwt. This server
    advertises "none" as its only token endpoint auth method.
  token-endpoint-auth-signing-alg-rs256: >-
    A SHOULD about an entry this server does not publish, for authentication
    methods it does not offer.
  token-endpoint-auth-signing-alg-not-none: >-
    Constrains a member this server omits. The "none" it does advertise is a
    client authentication method, not a signing algorithm.
  op-policy-uri-displayed: >-
    A SHOULD binding the registration UI when op_policy_uri is given. This
    server publishes no policy URL and its registration is RFC 7591 DCR, which
    has no page to display it on.
  op-tos-uri-displayed: >-
    As op_policy_uri: no terms-of-service URL is published, and DCR presents no
    page to display one on.
  revocation-endpoint-auth-signing-alg-present: >-
    Conditional on offering private_key_jwt or client_secret_jwt at the
    revocation endpoint. It advertises "none" alone.
  revocation-endpoint-auth-signing-alg-not-none: >-
    Constrains a member this server omits.
  introspection-endpoint-auth-methods-determined-otherwise: >-
    Conditional on publishing an introspection endpoint. This server has none.
  introspection-endpoint-auth-signing-alg-present: >-
    Conditional on an introspection endpoint this server does not publish.
  introspection-endpoint-auth-signing-alg-not-none: >-
    Constrains a member of a document section this server does not emit.
  additional-parameters-allowed: >-
    A MAY this server exercises — client_id_metadata_document_supported and
    authorization_response_iss_parameter_supported. A permission grants nothing
    to refuse, so there is no failing direction to test.
  signed-metadata-may-be-provided: >-
    A MAY. This server publishes plain JSON metadata only.
  signed-metadata-is-signed-or-maced: >-
    Binds a signed_metadata value this server never emits.
  signed-metadata-carries-iss: >-
    Binds a signed_metadata value this server never emits.
  signed-metadata-may-be-ignored: >-
    A MAY addressed to consumers of signed metadata. This server consumes none.
  signed-metadata-takes-precedence: >-
    A precedence rule for consumers of signed metadata. This server consumes
    none.
  signed-metadata-not-a-claim: >-
    A SHOULD NOT about the contents of a JWT this server never mints.
  well-known-path-https: >-
    As jwks-uri-https-scheme: the path is derived from the configured issuer,
    whose scheme the deployment chooses.
  well-known-suffix-is-iana-registered: >-
    This server uses the specification's own default suffix, registered by
    §7.3.1. That the string appears in the IANA registry is a fact about the
    string, not a behaviour; the path itself is pinned by
    document-at-well-known-path.
  application-names-its-suffix: >-
    An obligation on the specification an application writes, not on its code.
    docs/api.md and the OpenAPI description name the suffix.
  multiple-well-known-locations: >-
    A MAY this server exercises: the document is also served beneath the
    deployment's own prefix, and at openid-configuration. A permission has no
    failing direction.
  other-claims-may-be-returned: >-
    A MAY, covered by additional-parameters-allowed from the publishing side.
  response-not-used-on-issuer-mismatch: >-
    Binds the client reading a metadata document. Cetacean's OIDC login reads
    an upstream provider's document through go-oidc, which performs the check.
  comparisons-as-specified: >-
    The umbrella over the two rules that follow it, each dismissed on its own.
  no-unicode-normalization: >-
    Go compares strings bytewise over UTF-8 and normalizes nothing. There is no
    normalization step of ours to remove.
  code-point-equality: >-
    Bytewise comparison of UTF-8 is code-point equality. The behaviour is the
    language's, not this server's.
