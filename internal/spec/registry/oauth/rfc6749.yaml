source: RFC 6749
title: The OAuth 2.0 Authorization Framework
reviewed: 2026-09-16
url: https://www.rfc-editor.org/rfc/rfc6749

inventory:
  from: >-
    RFC 6749 §4.1.3, the five statements under "The authorization server
    MUST:". The rest of the document is not registered.
  count: 5

requirements:
  - id: code-bound-to-client
    level: MUST
    text: >-
      ensure that the authorization code was issued to the authenticated
      confidential client, or if the client is public, ensure that the code was
      issued to "client_id" in the request
    url: https://www.rfc-editor.org/rfc/rfc6749#section-4.1.3
    mutants:
      - file: internal/oauth/server.go
        replace: "	if clientID != codeData.ClientID {"
        with: "	if false && clientID != codeData.ClientID {"

  - id: code-must-be-valid
    level: MUST
    text: >-
      verify that the authorization code is valid
    url: https://www.rfc-editor.org/rfc/rfc6749#section-4.1.3
    mutants:
      - file: internal/oauth/store.go
        replace: "\tif !exists {\n\t\treturn AuthCodeData{}, false\n\t}\n\tif time.Now().After(entry.expiresAt) {"
        with: "\tif !exists {\n\t\treturn AuthCodeData{}, false\n\t}\n\tif false && time.Now().After(entry.expiresAt) {"
      - file: internal/oauth/store.go
        replace: "\tdelete(s.codes, h)"
        with: "\t_ = h"

  - id: code-bound-to-redirect-uri
    level: MUST
    text: >-
      ensure that the "redirect_uri" parameter is present if the "redirect_uri"
      parameter was included in the initial authorization request as described
      in Section 4.1.1, and if included ensure that their values are identical.
    url: https://www.rfc-editor.org/rfc/rfc6749#section-4.1.3
    mutants:
      - file: internal/oauth/server.go
        replace: "	if redirectURI != codeData.RedirectURI {"
        with: "	if false && redirectURI != codeData.RedirectURI {"

dismissed:
  require-client-authentication: >-
    Registration refuses any symmetric token_endpoint_auth_method, so every
    client this server issues codes to is public and has no credentials.
  authenticate-the-client: >-
    Same: no client of this server ever includes client authentication.
