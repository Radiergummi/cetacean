source: RFC 7519
title: JSON Web Token (JWT)
reviewed: 2026-09-17
url: https://www.rfc-editor.org/rfc/rfc7519

inventory:
  from: >-
    RFC 7519 §2, §3, §4 through §4.3, §5 through §5.3, §6, §7 through §7.3, §8
    and §12 in full. §1.1 is the RFC 2119 boilerplate and §10.1.1 is the IANA
    registration template. This deployment both mints and verifies JWTs, so
    producer and consumer statements are equally in scope.
  count: 51

requirements:
  - id: aud-mismatch-is-rejected
    level: MUST
    text: >-
      If the principal processing the claim does not identify itself with a
      value in the "aud" claim when this claim is present, then the JWT MUST be
      rejected.
    url: https://www.rfc-editor.org/rfc/rfc7519#section-4.1.3
    mutants:
      - file: internal/oauth/jwt.go
        replace: "\tif !slices.Contains(payload.Audience, aud) {"
        with: "\tif !slices.Contains(payload.Audience, aud) && false {"

  - id: aud-may-be-a-single-string
    level: MAY
    text: >-
      In the special case when the JWT has one audience, the "aud" value MAY be
      a single case-sensitive string containing a StringOrURI value.
    url: https://www.rfc-editor.org/rfc/rfc7519#section-4.1.3

  - id: exp-is-in-the-future
    level: MUST
    text: >-
      The processing of the "exp" claim requires that the current date/time
      MUST be before the expiration date/time listed in the "exp" claim.
    url: https://www.rfc-editor.org/rfc/rfc7519#section-4.1.4

  - id: nbf-has-passed
    level: MUST
    text: >-
      The processing of the "nbf" claim requires that the current date/time
      MUST be after or equal to the not-before date/time listed in the "nbf"
      claim.
    url: https://www.rfc-editor.org/rfc/rfc7519#section-4.1.5

  - id: duplicate-claim-names-resolved
    level: MUST
    text: >-
      JWT parsers MUST either reject JWTs with duplicate Claim Names or use a
      JSON parser that returns only the lexically last duplicate member name,
      as specified in Section 15.12 ("The JSON Object") of ECMAScript 5.1
      [ECMAScript].
    url: https://www.rfc-editor.org/rfc/rfc7519#section-4

  - id: jti-is-collision-resistant
    level: MUST
    text: >-
      The identifier value MUST be assigned in a manner that ensures that there
      is a negligible probability that the same value will be accidentally
      assigned to a different data object; if the application uses multiple
      issuers, collisions MUST be prevented among values produced by different
      issuers as well.
    url: https://www.rfc-editor.org/rfc/rfc7519#section-4.1.7

  - id: failed-validation-rejects-the-jwt
    level: MUST
    text: >-
      If any of the listed steps fail, then the JWT MUST be rejected -- that
      is, treated by the application as an invalid input.
    url: https://www.rfc-editor.org/rfc/rfc7519#section-7.2

  - id: unacceptable-algorithms-rejected
    level: SHOULD
    text: >-
      Even if a JWT can be successfully validated, unless the algorithms used
      in the JWT are acceptable to the application, it SHOULD reject the JWT.
    url: https://www.rfc-editor.org/rfc/rfc7519#section-7.2

  - id: hs256-and-none-implemented
    level: MUST
    text: >-
      Of the signature and MAC algorithms specified in JSON Web Algorithms
      [JWA], only HMAC SHA-256 ("HS256") and "none" MUST be implemented by
      conforming JWT implementations.
    url: https://www.rfc-editor.org/rfc/rfc7519#section-8
    deferred: >-
      This server implements ES256 alone and refuses both named algorithms. It
      cannot conform here and to RFC 9068 §2.1, which forbids "none" on an
      access token; where two specifications disagree the profile the tokens
      declare wins. HS256 is refused for its own reason — a verifier holding
      the key can mint, which is what the asymmetric signing design set out to
      end. Pinned by the table over none, HS256 and RS256.

dismissed:
  stringoruri-with-a-colon-is-a-uri: >-
    A syntax rule for StringOrURI values. Every one this server mints is an
    absolute https URL derived from the configured issuer.
  claims-set-may-carry-whitespace: >-
    A MAY about JSON formatting. encoding/json accepts it on the way in and
    emits none on the way out.
  claim-names-are-unique: >-
    The producing half of duplicate-claim-names-resolved. encoding/json emits
    one member per struct field, so a duplicate cannot be minted here.
  unknown-claims-ignored: >-
    Claims this server does not model are dropped by encoding/json rather than
    refused, which is what "ignored" asks for.
  iss-is-optional: >-
    An OPTIONAL claim this profile makes mandatory — see
    oauth/rfc9068/claim-iss-required.
  sub-is-locally-or-globally-unique: >-
    The subject is the upstream identity provider's, whose uniqueness is that
    provider's to guarantee within its own issuer.
  sub-is-optional: >-
    An OPTIONAL claim this profile makes mandatory — see
    oauth/rfc9068/claim-sub-required.
  every-principal-identifies-itself-in-aud: >-
    Addressed to the audience values a producer chooses. This server audiences
    a token for exactly one resource identifier, which is
    oauth/rfc8707/single-resource-per-token.
  aud-is-optional: >-
    An OPTIONAL claim this profile makes mandatory — see
    oauth/rfc9068/claim-aud-required.
  exp-bounds-acceptance: >-
    The definition exp-is-in-the-future states as a processing rule. One
    comparison answers both.
  exp-leeway-allowed: >-
    A MAY for clock skew this server declines: exp is compared against the
    current time with no grace, and the TTL is an hour.
  exp-is-a-numericdate: >-
    Held by the type — ExpiresAt is an int64 of Unix seconds, so no other shape
    can be emitted.
  exp-is-optional: >-
    An OPTIONAL claim this profile makes mandatory — see
    oauth/rfc9068/claim-exp-required.
  nbf-bounds-acceptance: >-
    The definition nbf-has-passed states as a processing rule. One comparison
    answers both.
  nbf-leeway-allowed: >-
    A MAY for clock skew this server declines, as with exp.
  nbf-is-a-numericdate: >-
    Held by the type, as with exp.
  nbf-is-optional: >-
    An OPTIONAL claim this server never mints. It is honoured on the way in —
    see nbf-has-passed.
  iat-is-a-numericdate: >-
    Held by the type, as with exp.
  iat-is-optional: >-
    An OPTIONAL claim this profile makes mandatory — see
    oauth/rfc9068/claim-iat-required.
  jti-is-optional: >-
    An OPTIONAL claim this profile makes mandatory — see
    oauth/rfc9068/claim-jti-required.
  private-claim-names-allowed: >-
    A MAY this server exercises for email, name and groups, which the ACL
    resolves an audience against.
  typ-should-be-jwt: >-
    A RECOMMENDED superseded by the profile these tokens declare: RFC 9068
    §2.1 requires "at+jwt", which is oauth/rfc9068/typ-is-at-jwt.
  typ-spelled-uppercase: >-
    A RECOMMENDED about spelling "JWT", which these tokens do not use.
  typ-is-optional: >-
    An OPTIONAL header parameter RFC 9068 makes mandatory.
  cty-not-recommended: >-
    A NOT RECOMMENDED this server follows: it emits no cty.
  cty-required-when-nested: >-
    Conditional on nested signing or encryption, which this server does not
    employ.
  cty-spelled-uppercase: >-
    A RECOMMENDED about a header parameter this server never emits.
  replicated-claims-verified: >-
    Conditional on replicating claims into the header, which this server does
    not do: the header carries alg, kid and typ.
  other-replicated-claim-names-may-be-registered: >-
    A MAY addressed to other specifications.
  unsecured-jwts-allowed: >-
    A MAY for JWTs with no signature. Refused outright — see
    oauth/rfc9068/alg-is-not-none.
  jwt-conforms-to-jws-or-jwe: >-
    Every token this server mints is a JWS, which the ES256 signing path is.
  jws-creation-steps-followed: >-
    The JWS construction itself, whose observable half is
    oauth/rfc9068/tokens-are-signed and the RFC 7515 vector test.
  jwe-creation-steps-followed: >-
    Conditional on creating a JWE. This server encrypts no tokens.
  string-comparison-rules: >-
    Go compares strings bytewise over UTF-8, which is §7.3's rule.
  rs256-and-es256-recommended: >-
    A RECOMMENDED this server meets by half: ES256 is what it signs and
    verifies with, RS256 is refused — see
    oauth/rfc9068/rs256-among-supported-algorithms.
  other-algorithms-optional: >-
    An OPTIONAL this server declines: one algorithm, deliberately.
  encryption-support-optional: >-
    An OPTIONAL this server declines.
  encryption-algorithms-required-if-encrypting: >-
    Conditional on providing encryption capabilities, which this server does
    not.
  key-agreement-recommended: >-
    A RECOMMENDED conditional on encryption this server does not implement.
  other-encryption-algorithms-optional: >-
    An OPTIONAL conditional on encryption this server does not implement.
  nested-jwt-support-optional: >-
    An OPTIONAL this server declines.
  private-information-disclosure-prevented: >-
    A privacy MUST over what a token carries. These tokens carry the subject,
    email and group names the ACL needs, to the client that authenticated as
    that subject.
