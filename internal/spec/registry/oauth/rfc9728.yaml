source: RFC 9728
title: OAuth 2.0 Protected Resource Metadata
reviewed: 2026-09-17
url: https://www.rfc-editor.org/rfc/rfc9728

inventory:
  from: >-
    RFC 9728 §2's REQUIRED and RECOMMENDED parameters and the MUSTs attached to
    any parameter, §2.1, §2.2, §3 through §3.3, §4, §5 through §5.4, and §6 in
    full. The bare OPTIONAL declarations are excluded: they bind nothing. §7 is
    excluded too — its statements bind the client's TLS stack, the deployment's
    transport and the authorization server, not this document's handler.
  count: 54

requirements:
  - id: resource-required
    level: MUST
    text: >-
      REQUIRED. The protected resource's resource identifier, as defined in
      Section 1.2.
    url: https://www.rfc-editor.org/rfc/rfc9728#section-2
    mutants:
      - file: internal/oauth/prm.go
        replace: "\t\tResource:               s.cfg.identifierOf(r),"
        with: "\t\tResource:               \"\","

  - id: scopes-supported-recommended
    level: SHOULD
    text: >-
      RECOMMENDED. JSON array containing a list of scope values, as defined in
      OAuth 2.0 [RFC6749], that are used in authorization requests to request
      access to this protected resource.
    url: https://www.rfc-editor.org/rfc/rfc9728#section-2

  - id: resource-name-recommended
    level: SHOULD
    text: >-
      Human-readable name of the protected resource intended for display to the
      end user. It is RECOMMENDED that protected resource metadata include this
      field.
    url: https://www.rfc-editor.org/rfc/rfc9728#section-2

  - id: document-at-well-known-url
    level: MUST
    text: >-
      Protected resources supporting metadata MUST make a JSON document
      containing metadata as specified in Section 2 available at a URL formed
      by inserting a well-known URI string into the protected resource's
      resource identifier between the host component and the path and/or query
      components, if any. By default, the well-known URI string used is
      /.well-known/oauth-protected-resource.
    url: https://www.rfc-editor.org/rfc/rfc9728#section-3
    mutants:
      - file: internal/oauth/resource.go
        replace: "const wellKnownPRM = \"/.well-known/oauth-protected-resource\""
        with: "const wellKnownPRM = \"/.well-known/oauth-resource-metadata\""

  - id: queried-with-get
    level: MUST
    text: >-
      A protected resource metadata document MUST be queried using an HTTP GET
      request at the previously specified URL.
    url: https://www.rfc-editor.org/rfc/rfc9728#section-3.1
    mutants:
      - file: internal/oauth/server.go
        replace: "\t\tmux.HandleFunc(\"GET \"+conformant, handler)"
        with: "\t\tmux.HandleFunc(conformant, handler)"

  - id: well-known-segment-precedes-the-path-component
    level: MUST
    text: >-
      If the resource identifier value contains a path or query component, any
      terminating slash (/) following the host component MUST be removed before
      inserting /.well-known/ and the well-known URI path suffix between the
      host component and the path and/or query components.
    url: https://www.rfc-editor.org/rfc/rfc9728#section-3.1
    mutants:
      - file: internal/oauth/resource.go
        replace: "\treturn wellKnownPRM + basePath + r.Path"
        with: "\treturn basePath + wellKnownPRM + r.Path"

  - id: response-is-200-json
    level: MUST
    text: >-
      A successful response MUST use the 200 OK HTTP status code and return a
      JSON object using the application/json content type that contains a set
      of metadata parameters as its members that are a subset of the metadata
      parameters defined in Section 2.
    url: https://www.rfc-editor.org/rfc/rfc9728#section-3.2
    mutants:
      - file: internal/oauth/prm.go
        replace: "\t\twriteDiscoveryDoc(w, doc, \"application/json\")"
        with: "\t\twriteDiscoveryDoc(w, doc, \"text/plain\")"

  - id: zero-value-parameters-omitted
    level: MUST
    text: >-
      Parameters with zero values MUST be omitted from the response.
    url: https://www.rfc-editor.org/rfc/rfc9728#section-3.2
    deferred: >-
      Every document emits an empty scopes_supported rather than omitting it,
      for the reason the authorization server metadata gives: this resource has
      no scopes, and an empty array says so where an absent field says nothing.
      The same divergence as oauth/rfc8414/zero-element-claims-omitted, pinned
      by the same test.

  - id: resource-matches-the-retrieval-url
    level: MUST
    text: >-
      The resource value returned MUST be identical to the protected resource's
      resource identifier value into which the well-known URI path suffix was
      inserted to create the URL used to retrieve the metadata.
    url: https://www.rfc-editor.org/rfc/rfc9728#section-3.3
    mutants:
      - file: internal/oauth/prm.go
        replace: "\t\tResource:               s.cfg.identifierOf(r),\n\t\tAuthorizationServers:   []string{iss},"
        with: "\t\tResource:               s.cfg.identifierOf(r) + \"/\",\n\t\tAuthorizationServers:   []string{iss},"

dismissed:
  authorization-servers-may-be-withheld: >-
    A MAY about advertising fewer authorization servers than are supported.
    This deployment is its own, and names it.
  jwks-uri-https-scheme: >-
    Constrains a resource-server JWK Set this deployment does not publish. It
    signs no resource responses.
  jwks-use-parameter-required: >-
    Conditional on a resource JWK Set carrying both signing and encryption
    keys. There is no resource JWK Set.
  scopes-may-be-withheld: >-
    A MAY about advertising fewer scopes than are supported. This resource
    defines none, so there is nothing to withhold.
  resource-signing-alg-not-none: >-
    Constrains a parameter this deployment omits. No resource response is
    signed.
  resource-name-may-be-internationalized: >-
    A MAY. The name is published untagged — one deployment, one name, with no
    locale-specific variants for a client to choose between.
  resource-documentation-may-be-internationalized: >-
    A MAY. The documentation URL is one link to the API reference, in English,
    with no locale-tagged variants.
  resource-policy-uri-may-be-internationalized: >-
    A MAY about a field this deployment does not publish.
  resource-tos-uri-may-be-internationalized: >-
    A MAY about a field this deployment does not publish.
  additional-parameters-allowed: >-
    A MAY. A permission grants nothing to refuse, so there is no failing
    direction to test.
  human-readable-values-may-be-multilingual: >-
    A MAY this deployment does not exercise: no metadata field carries a
    language tag.
  language-tag-case-as-registered: >-
    A RECOMMENDED about spelling language tags this deployment never emits.
  language-tags-read-case-insensitively: >-
    A SHOULD binding a consumer of tagged metadata. This deployment reads no
    protected resource metadata but its own.
  tagged-names-may-be-displayed: >-
    A MAY addressed to whatever displays the names. Nothing here displays them.
  untagged-values-carry-no-language-assumption: >-
    Binds the party using an untagged human-readable value. This deployment
    publishes two, the resource name and the documentation URL, and consumes
    none.
  untagged-instance-recommended: >-
    A RECOMMENDED about accompanying tagged fields with an untagged one. Every
    field here is untagged already, which is the shape it asks for.
  untagged-values-widely-displayable: >-
    A RECOMMENDED about the content of untagged human-readable values. Those
    published are a URL and a short ASCII name.
  signed-metadata-may-be-provided: >-
    A MAY. This deployment publishes plain JSON metadata only.
  signed-metadata-is-signed-or-maced: >-
    Binds a signed_metadata value this deployment never emits.
  signed-metadata-carries-iss: >-
    Binds a signed_metadata value this deployment never emits.
  signed-metadata-may-be-ignored: >-
    A MAY addressed to consumers of signed metadata. This deployment consumes
    none.
  signed-metadata-takes-precedence: >-
    A precedence rule for consumers of signed metadata. This deployment
    consumes none.
  signed-metadata-not-a-claim: >-
    A SHOULD NOT about the contents of a JWT this deployment never mints.
  signed-metadata-recursion-rejected: >-
    A RECOMMENDED to reject metadata whose JWT carries signed_metadata. Nothing
    here reads signed metadata.
  well-known-suffix-is-iana-registered: >-
    This deployment uses the specification's own default suffix, registered by
    §8.3.1. That the string appears in the IANA registry is a fact about the
    string, not a behaviour; the path itself is pinned by
    document-at-well-known-url.
  other-suffixes-may-be-registered: >-
    A MAY about registering an application-specific suffix. This deployment
    uses the default.
  application-names-its-suffix: >-
    An obligation on the specification an application writes, not on its code.
    docs/api.md and the OpenAPI description name the suffix.
  multiple-well-known-locations: >-
    A MAY this deployment exercises: each document is also served beneath the
    deployment's own prefix, where a proxy forwarding only that prefix can
    reach it. A permission has no failing direction.
  additional-response-parameters-allowed: >-
    A MAY, covered by additional-parameters-allowed from the publishing side.
  unknown-parameters-ignored: >-
    Binds the client reading a document. This deployment reads no protected
    resource metadata but its own.
  response-not-used-on-identifier-mismatch: >-
    Binds the client validating a document it retrieved. The publishing half is
    resource-matches-the-retrieval-url.
  resource-matches-the-challenge-url: >-
    Binds the client that followed a WWW-Authenticate resource_metadata URL.
    The challenge names this resource's own document, and both spellings of
    that document carry the same resource value.
  response-not-used-on-challenge-mismatch: >-
    The refusal half of resource-matches-the-challenge-url, and equally the
    client's.
  signed-metadata-signature-validated: >-
    Binds a recipient of signed metadata. This deployment receives none.
  signed-metadata-failure-is-an-error: >-
    A SHOULD conditional on validating a signature this deployment never
    checks.
  protected-resources-may-be-withheld: >-
    A MAY about the authorization server's protected_resources parameter, which
    this server does not publish: the set is enumerable but naming it adds
    nothing a client cannot derive from the document it already fetched.
  challenge-may-name-the-metadata: >-
    A MAY this deployment exercises on every 401. What makes the challenge
    correct — that it names this resource's document and not a neighbour's — is
    a rule of ours, not of §5, and internal/oauth holds it directly.
  challenge-parameter-in-other-schemes: >-
    A MAY about schemes other than Bearer. This deployment offers Bearer alone.
  challenge-parameter-combines-with-extensions: >-
    A MAY about parameters from extensions this deployment does not implement.
  challenge-may-signal-changed-metadata: >-
    A MAY about re-challenging when metadata changes. Every field is fixed at
    startup, so it never changes while the process runs.
  client-retrieves-changed-metadata: >-
    A SHOULD binding the client that receives such a re-challenge.
  other-authentication-schemes-offered: >-
    A MAY about offering further WWW-Authenticate headers. The scheme a request
    is challenged with follows the configured auth mode, which is not this
    document's concern.
  comparisons-as-specified: >-
    The umbrella over the two rules that follow it, each dismissed on its own.
  no-unicode-normalization: >-
    Go compares strings bytewise over UTF-8 and normalizes nothing. There is no
    normalization step of ours to remove.
  code-point-equality: >-
    Bytewise comparison of UTF-8 is code-point equality. The behaviour is the
    language's, not this deployment's.
