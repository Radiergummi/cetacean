source: in-toto Attestation Framework
title: in-toto Attestation Framework, Statement layer
revision: v1.1.0
reviewed: 2026-10-27
url: https://github.com/in-toto/attestation/blob/v1.1.0/spec/v1/statement.md

inventory:
  from: >-
    The "Fields" section in full, counted one sentence to a statement. Image
    attestations read the predicate type and predicate of the statements
    BuildKit attaches to an image; they never check a subject, because the
    statement is reached through the index that names the image, and they
    verify nothing.
  count: 5

requirements:
  - id: predicate-may-be-omitted
    level: MAY
    text: >-
      MAY be omitted if `predicateType` fully describes the predicate.
    url: https://github.com/in-toto/attestation/blob/v1.1.0/spec/v1/statement.md#fields

dismissed:
  subject-has-digest: >-
    Binds the producer. The subject is never read: the statement is reached
    through the image index that names the image it is about.
  subject-is-immutable: >-
    Describes the artifacts, not a reader of the statement.
  name-may-inform-policy: >-
    A MAY for a consumer evaluating policy. Nothing here evaluates policy; it
    displays what the statement says.
  name-and-uri-unique: >-
    Binds the producer, and the subject is never read.
