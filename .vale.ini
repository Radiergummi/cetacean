# Prose linting for the published docs; `make lint-docs` runs it. The packages
# are fetched by `vale sync` at the versions pinned here, and gitignored.
StylesPath = .vale/styles
MinAlertLevel = warning
Vocab = Cetacean
Packages = https://github.com/errata-ai/Google/releases/download/v0.7.0/Google.zip, \
  https://github.com/errata-ai/proselint/releases/download/v0.3.4/proselint.zip

[*.{md,mdx}]
BasedOnStyles = Vale, Google, proselint, Cetacean

# House style: spaced em dashes, no serial comma, and punctuation outside the
# quotes when a literal value is quoted.
Google.EmDash = NO
Google.OxfordComma = NO
Google.Quotes = NO

# Google's product vocabulary ("APIs Explorer", "tap"), not ours; the terms
# that matter here are in Cetacean.Terms.
Google.WordList = NO
Google.WordListCase = NO

# Flags GitHub's `> [!NOTE]` alerts; Cetacean.Placeholders takes its place.
proselint.Annotations = NO

# Errors fail the build and warnings only annotate. Headings are part of what
# keeps the pages uniform, so they fail it too.
Google.Headings = error
