version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
      - github-actions
    # One PR for every action bump, including majors — deliberately unlike
    # the other ecosystems below, which leave majors out of their group. For
    # a SHA-pinned action a major is usually just a runner bump, and holding
    # one back would leave the pin stale for a week. Dependabot reads the
    # trailing `# v…` comment on each pinned SHA to figure out the current
    # version, so the SHA-pinning convention in ci.yml/pages.yml/release.yml
    # still works here.
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
      include: scope
    labels:
      - dependencies
      - go
    # One PR for every minor and patch Go module bump. Majors are left out
    # of the group so each arrives as its own PR: a Go major is an import-path
    # change (/v2 -> /v3) and never merges on sight.
    groups:
      go-deps:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # docker/docker periodically ships advisories (docker cp races, etc.)
      # that target the daemon, not SDK consumers. Cetacean uses the SDK
      # only for inspect/event/log calls and is not exposed. Skip the
      # advisory-driven bump PRs so we don't churn on unfixable noise.
      # Re-evaluate if we ever wire up docker cp / container archive APIs.
      - dependency-name: "github.com/docker/docker"
        update-types:
          - version-update:semver-patch

  # Dashboard SPA. Production deps shipped to users.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore(deps)
      include: scope
    labels:
      - dependencies
      - frontend
    groups:
      # Lint/format tooling gets its own PR. A new oxlint release can promote
      # fresh rules into the `correctness` category, which fails lint-frontend
      # on code that was green before. Kept separate so that never blocks the
      # security updates in the group below. oxlint/oxfmt are pinned to exact
      # versions in package.json for the same reason.
      frontend-lint:
        patterns:
          - "oxlint"
          - "oxfmt"
        update-types:
          - minor
          - patch
      # One PR for every other minor and patch frontend bump. Majors are
      # excluded from the group so a grouped PR stays mergeable on sight;
      # each major then arrives on its own and can be reviewed and tested
      # without holding up the safe bumps beside it.
      frontend:
        patterns:
          - "*"
        exclude-patterns:
          - "oxlint"
          - "oxfmt"
        update-types:
          - minor
          - patch

  # Marketing/docs site (Astro).
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
      include: scope
    labels:
      - dependencies
      - website
    groups:
      website-all:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
