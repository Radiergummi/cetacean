version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
      - github-actions
    # One PR for every action bump, including majors. Dependabot reads the
    # trailing `# v…` comment on each pinned SHA to figure out the current
    # version, so the SHA-pinning convention in ci.yml/pages.yml/release.yml
    # still works here.
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
      include: scope
    labels:
      - dependencies
      - go
    # One PR for every Go module bump, including majors.
    groups:
      go-deps:
        patterns:
          - "*"
    ignore:
      # docker/docker periodically ships advisories (docker cp races, etc.)
      # that target the daemon, not SDK consumers. Cetacean uses the SDK
      # only for inspect/event/log calls and is not exposed. Skip the
      # advisory-driven bump PRs so we don't churn on unfixable noise.
      # Re-evaluate if we ever wire up docker cp / container archive APIs.
      - dependency-name: "github.com/docker/docker"
        update-types:
          - version-update:semver-patch

  # Dashboard SPA. Production deps shipped to users.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore(deps)
      include: scope
    labels:
      - dependencies
      - frontend
    groups:
      # One PR for every frontend dependency bump, including majors.
      frontend:
        patterns:
          - "*"

  # Marketing/docs site (Astro).
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
      include: scope
    labels:
      - dependencies
      - website
    groups:
      website-all:
        patterns:
          - "*"
