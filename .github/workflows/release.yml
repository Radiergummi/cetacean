name: Release

on:
  push:
    tags: ["v*"]

# Granted per job rather than here: sbom-gate and build run `npm ci` and the
# frontend build, so a compromised transitive dependency would otherwise read a
# token that can push to main, move tags and publish images.
permissions: {}

jobs:
  # The committed SBOM is embedded in the binary, and main is allowed to carry
  # it stale for a run or two: a Dependabot PR merges without one and
  # chore/sbom-sync repairs it afterwards. A release must not go out in that
  # window, so check before anything is built.
  sbom-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      # cyclonedx-gomod compiles the package, so main.go's //go:embed needs the
      # built frontend present.
      - run: cd frontend && npm run build && npm run build:widgets
      - run: make sbom
      - name: Verify the tagged SBOM matches the tagged dependencies
        run: |
          make sbom-verify \
            || { echo "::error::The SBOM committed at this tag is stale. Merge chore/sbom-sync, then re-tag."; exit 1; }

  build:
    needs: [sbom-gate]
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      # Both bundles: main.go embeds frontend/dist and frontend/dist-widgets,
      # so go build cannot resolve its //go:embed without the widget build.
      - run: cd frontend && npm run build && npm run build:widgets
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          go build -ldflags "-s -w \
            -X github.com/radiergummi/cetacean/internal/version.Version=$VERSION \
            -X github.com/radiergummi/cetacean/internal/version.Commit=${COMMIT::8} \
            -X github.com/radiergummi/cetacean/internal/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "cetacean-${{ matrix.os }}-${{ matrix.arch }}" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cetacean-${{ matrix.os }}-${{ matrix.arch }}
          path: cetacean-${{ matrix.os }}-${{ matrix.arch }}

  docker:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: release.Dockerfile
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cetacean-linux-*
          merge-multiple: true

      - name: Prepare binaries
        run: |
          mkdir -p binaries/linux/amd64 binaries/linux/arm64
          cp cetacean-linux-amd64 binaries/linux/amd64/cetacean
          cp cetacean-linux-arm64 binaries/linux/arm64/cetacean
          chmod +x binaries/linux/amd64/cetacean binaries/linux/arm64/cetacean

      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ vars.DOCKER_HUB_USERNAME }}/cetacean
          annotations: |
            org.opencontainers.image.description="A real-time observability dashboard for Docker Swarm clusters."
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # A pre-release tag (v1.0.0-rc1) must not move :latest for
            # everyone running the plain image. The semver patterns above
            # already handle pre-releases correctly; this one would not.
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: release.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      # The binaries are the common install path, so they get provenance of
      # their own. checksums.txt is generated here from these same files and so
      # attests to nothing on its own; the statement below is what ties each
      # binary to this workflow, this commit and this tag.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: cetacean-*

      - name: Generate checksums
        run: sha256sum cetacean-* > checksums.txt

      - name: Extract changelog for this version
        id: changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          # Extract the section for this version from CHANGELOG.md
          awk -v version="$VERSION" \
            '$0 ~ "^## \\[" version "\\]" {found=1; next} /^## \[/{if(found) exit} found' \
            CHANGELOG.md > release-notes.md
          # Fall back to auto-generated notes if no section found
          if [ ! -s release-notes.md ]; then
            echo "fallback=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -s release-notes.md ]; then
            gh release create "$TAG" --notes-file release-notes.md cetacean-* checksums.txt
          else
            gh release create "$TAG" --generate-notes cetacean-* checksums.txt
          fi
