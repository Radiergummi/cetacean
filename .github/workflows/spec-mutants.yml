name: Spec mutants

on:
  push:
    branches: [main]
  # Only the paths no Go build or test reads are left out: the tests also read
  # docs/, frontend/ and api/, so a change there can still decide a mutant.
  pull_request:
    paths-ignore:
      - "website/**"
      - "CHANGELOG.md"
      - "pnpm-lock.yaml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# The same rule as ci.yml: a superseded pull request run is cancelled, a run on
# main is not.
concurrency:
  group: spec-mutants-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  spec-mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-mutants-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-mutants-${{ runner.os }}-
      - run: make spec-mutants
