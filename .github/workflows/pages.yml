name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "website/**"
      - "frontend/**"
      - "CHANGELOG.md"
      - "api/openapi.yaml"
      # The error reference is generated from these; see website/package.json.
      - "internal/api/errors.go"
      - "scripts/dump-errors/**"
      # Served at /dist/ by the website; see website/package.json sync-assets.
      - "compose*.yaml"
      - "prometheus.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Read-only by default: the build runs pnpm install and the Astro build, and must not
# hold a scope that can publish. deploy takes the write scopes on its own.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The sitemap's `lastmod` and every page's modified date come from the
          # last commit that touched the file. A shallow clone holds one commit
          # with no parent, so `git log -1 -- <path>` reports *its* date for
          # every path — every page would carry the date of the deploy. The
          # build refuses a shallow clone rather than publish that.
          fetch-depth: 0

      - uses: ./.github/actions/node

      # The website build generates its error reference from internal/api; see
      # website/package.json's sync-assets script.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build demo SPA
        run: |
          mkdir -p website/public/demo
          pnpm --filter frontend build:demo

      - name: Build website
        run: |
          # Diagrams in docs/ are rendered to SVG at build time by a headless
          # browser; without it every mermaid block fails the build.
          pnpm --filter website exec playwright install --with-deps chromium
          pnpm --filter website build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
