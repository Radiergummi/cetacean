name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "website/**"
      - "frontend/**"
      - "CHANGELOG.md"
      - "api/openapi.yaml"
      # The error reference is generated from these; see website/package.json.
      - "internal/api/errors.go"
      - "scripts/dump-errors/**"
      # Served at /dist/ by the website; see website/package.json sync-assets.
      - "compose*.yaml"
      - "prometheus.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 25

      # The website build generates its error reference from internal/api; see
      # website/package.json's sync-assets script.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build demo SPA
        working-directory: frontend
        run: |
          npm ci
          mkdir -p ../website/public/demo
          npm run build:demo

      - name: Build website
        working-directory: website
        run: |
          npm ci
          # Diagrams in docs/ are rendered to SVG at build time by a headless
          # browser; without it every mermaid block fails the build.
          npx playwright install --with-deps chromium
          npm run build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
