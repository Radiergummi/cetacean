name: Docker

# Releases ship release.Dockerfile, which only copies prebuilt binaries, so the
# source Dockerfile people build themselves is exercised nowhere else. Not path
# filtered: the build reads files no short list names, such as embedded docs.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-source-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the source Dockerfile without pushing
        run: |
          docker build \
            --build-arg VERSION=ci \
            --build-arg COMMIT="${GITHUB_SHA::8}" \
            --build-arg SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            -t cetacean:ci .
