name: CI

on:
  push:
    branches: [main]
  # Every pull request, not only those based on main. A stacked pull request is
  # based on the branch below it, and filtering by base leaves every branch in a
  # stack untested until it reaches the front of the queue.
  pull_request:

permissions:
  contents: read

# A superseded run has nothing left to report, but without this it runs to
# completion anyway. Pull requests only: every commit on main owes a SBOM sync
# and a Pages deploy, and cancelling one leaves that commit unserved. This
# overrides sbom-sync's own group, which is safe — see the note there.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/node
      - run: pnpm --filter frontend build
      - run: pnpm --filter frontend build:widgets
      - run: mkdir -p website/public/demo && pnpm --filter frontend build:demo
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          # Both build outputs: main.go embeds frontend/dist AND
          # frontend/dist-widgets. Two paths root the archive at their common
          # ancestor, so consumers download into frontend/ rather than
          # frontend/dist.
          path: |
            frontend/dist
            frontend/dist-widgets
          retention-days: 1

  test:
    needs: build-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Cached below instead. setup-go keys every job on the same
          # go.sum hash, so the four Go jobs race for one entry and the
          # winner keeps it: this job then restores a blob built without
          # -race and recompiles the stdlib and every dependency.
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-test-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-test-${{ runner.os }}-
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: frontend
      - run: go build .
      # -count=1 is what makes the claims usable: the claims directory is read
      # through the environment, so an unchanged package with the same value
      # replays a cached result and records nothing.
      - run: mkdir -p .spec-claims
      - run: go test -race -count=1 ./...
        env:
          CETACEAN_SPEC_CLAIMS: ${{ github.workspace }}/.spec-claims
      # static asks whether a claim was written; report asks whether the test
      # that writes it passed. Neither answers for the other.
      - run: go run ./scripts/spec-gate report --claims .spec-claims --suites unit
      - run: make spec
      # make spec vets the e2e tree with spec-vet alone; this is the only
      # run of the standard analyzers over it, which golangci-lint skips.
      - run: go vet -tags e2e ./test/e2e/...

  lint-go:
    needs: build-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: frontend
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pinned deliberately. `latest` silently drifts and breaks CI
          # when a new release ships stricter rules (e.g. 2.12.0 added
          # govet/inline, modernize/slicesbackward, broader gosec/G124).
          # Bump in lockstep with the local Homebrew formula.
          version: v2.14.0
      # `golangci-lint run` does not evaluate the `formatters:` section of
      # .golangci.yml (gofmt/goimports/golines) — only `golangci-lint fmt`
      # does. Without this step misformatted Go passes CI and is caught only
      # by a local `make fmt-check`.
      - run: golangci-lint fmt --diff ./... 2>&1 | diff /dev/null -
      # The four-line cap on comment blocks, which no golangci linter enforces.
      - run: go run ./scripts/comment-cap
      - run: make vuln

  lint-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint ships no action, and building it from source costs a Go
      # toolchain and a module download to produce a binary that runs in a
      # second. Take the published build and pin its digest, which is a
      # tighter claim than a tag on an action would be.
      - env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v$VERSION/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "$SHA256  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
          rm actionlint actionlint.tar.gz
      - run: actionlint -color
      # zizmor's own action is composite and installs it the same way, so
      # there is nothing to win by spending an allowlist entry on it.
      - run: pipx install zizmor==1.30.1
      # Online, so that an action going known-bad fails a run rather than
      # waiting to be noticed. zizmor's own version is pinned, which keeps
      # rule drift out; what drifts here is the advisory data, and that is
      # the point of running it.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --config .github/zizmor.yml .github/workflows/

  lint-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The published build with a pinned digest, as for actionlint. vale-action
      # wraps the same binary in reviewdog; the template below gets the inline
      # annotations without it.
      - env:
          VERSION: 3.22.0
          SHA256: 52f5cd0314a1b7384cac6aa102a68193977312f6ba9c9f3ae001b5deec8e3a10
        run: |
          curl -fsSL -o vale.tar.gz \
            "https://github.com/vale-cli/vale/releases/download/v$VERSION/vale_${VERSION}_Linux_64-bit.tar.gz"
          echo "$SHA256  vale.tar.gz" | sha256sum -c -
          tar -xzf vale.tar.gz vale
          sudo install -m 0755 vale /usr/local/bin/vale
          rm vale vale.tar.gz
      - run: make lint-docs VALE_FLAGS=--output=.vale/github.tmpl

  lint-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/node
      - run: pnpm --filter frontend exec oxlint
      - run: pnpm --filter frontend exec knip
      - run: pnpm --filter frontend exec oxfmt --check .
      - run: pnpm --filter frontend check
      # The whole workspace: audit reads the lockfile and ignores --filter.
      # Lows and moderates in build-time chains often have no fix yet; they are
      # counted here without failing the run.
      - run: pnpm audit --prod --audit-level high

  lint-website:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/node

      # `astro check` type-checks `src/lib/errors.ts`, which imports the error
      # reference generated from internal/api; see website/package.json's
      # sync-assets script.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - run: pnpm --filter website exec oxlint
      - run: pnpm --filter website exec oxfmt --check .
      - run: pnpm --filter website sync-assets
      - run: pnpm --filter website check

  # pages.yml builds the site only on main, after a merge. This builds it the same
  # way on every pull request, so a page or diagram that breaks the build fails
  # here, and the artifact is the site as it would deploy.
  build-website:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The build refuses a shallow clone; see the same step in pages.yml.
          fetch-depth: 0
      - uses: ./.github/actions/node
      # The error reference is generated from internal/api by sync-assets.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: mkdir -p website/public/demo && pnpm --filter frontend build:demo
      - run: pnpm --filter website build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-dist
          path: website/dist
          retention-days: 7

  test-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/node
      - run: pnpm --filter frontend test --run

  sbom-sync:
    needs: build-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Keeps the committed SBOM current instead of asking the author to.
    #
    # On a pull request from this repository the regenerated artifacts are
    # committed back to the branch. That covers the ways drift actually happens:
    # cyclonedx-gomod cannot run in a linked worktree (so the pre-commit hook
    # skips there), and people forget.
    #
    # Dependabot's own pull requests are the exception, and deliberately so.
    # Dependabot stops updating a branch that carries a commit it did not
    # author, so committing here would cost `@dependabot rebase` for the life
    # of every dependency PR — and a rebase is exactly what two groups sharing
    # one lockfile need every week. Those PRs are reported on but not written
    # to; they merge with the SBOM stale, and the push-to-main run below opens
    # a pull request that repairs it. A fork PR is reported on for a different
    # reason: its token is read-only, so nothing can be written either way.
    # Writes go through the App token below, so GITHUB_TOKEN only reads.
    permissions:
      contents: read
    # One sync per branch: two concurrent runs would race the same commit.
    # The workflow-level group above still cancels this job on a new pull
    # request push, which is safe: createCommitOnBranch either landed or it
    # did not, and the superseding run syncs again from the newer head.
    concurrency:
      group: sbom-sync-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull_request checkout is a detached merge commit by default, which
          # has no branch to commit onto. Check out the head itself.
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/node
      # cyclonedx-gomod compiles the package, so main.go's //go:embed
      # frontend/dist/* needs the built frontend. Reuse the build-frontend
      # artifact rather than rebuilding it here.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: frontend
      - run: make sbom

      # A commit or pull request made with GITHUB_TOKEN raises no event, and one
      # pushed to a pull request leaves runs waiting for approval that hide the
      # required checks. The App's writes trigger CI like anyone else's.
      - name: Create App token
        id: app-token
        if: >-
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name == github.repository &&
           github.event.pull_request.user.login != 'dependabot[bot]') ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SBOM_APP_CLIENT_ID }}
          private-key: ${{ secrets.SBOM_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # Same-repo pull request: commit the result. createCommitOnBranch is used
      # rather than `git push` because GitHub signs commits authored through the
      # API, so the result is Verified with no signing key in CI secrets, and
      # because expectedHeadOid makes the write fail rather than clobber a
      # branch that moved since checkout.
      - name: Commit regenerated SBOM
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Via the environment, not interpolated into the script: a branch name
          # is attacker-controlled and would otherwise be a shell injection.
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/commit-sbom.sh "$HEAD_REF" "$HEAD_SHA"

      # Fork or Dependabot pull request: the branch is not written to, so
      # report and pass. Neither case is a fault the author can fix.
      - name: Report SBOM drift
        if: >-
          github.event_name == 'pull_request' &&
          (github.event.pull_request.head.repo.full_name != github.repository ||
           github.event.pull_request.user.login == 'dependabot[bot]')
        run: |
          if ! make sbom-verify; then
            echo "::warning::SBOM is stale. It is not committed here — a fork PR cannot be written to, and writing to a Dependabot branch would stop it rebasing. The push-to-main run opens a pull request that repairs it."
          fi

      # Push to main: the backstop. CI must never commit to the default branch,
      # so drift here becomes a pull request of its own rather than a red run —
      # merging a Dependabot PR is the expected way to get here.
      - name: Open SBOM sync pull request
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ github.sha }}
        run: ./scripts/open-sbom-pr.sh "$BASE_SHA"
