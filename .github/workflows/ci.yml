name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run build
      - run: cd frontend && npm run build:widgets
      - run: cd frontend && mkdir -p ../website/public/demo && npm run build:demo
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          # Both build outputs: main.go embeds frontend/dist AND
          # frontend/dist-widgets. Two paths root the archive at their common
          # ancestor, so consumers download into frontend/ rather than
          # frontend/dist.
          path: |
            frontend/dist
            frontend/dist-widgets
          retention-days: 1

  test:
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: frontend
      - run: go build .
      - run: go test -race ./...

  lint-go:
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: frontend
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pinned deliberately. `latest` silently drifts and breaks CI
          # when a new release ships stricter rules (e.g. 2.12.0 added
          # govet/inline, modernize/slicesbackward, broader gosec/G124).
          # Bump in lockstep with the local Homebrew formula.
          version: v2.12.2
      # `golangci-lint run` does not evaluate the `formatters:` section of
      # .golangci.yml (gofmt/goimports/golines) — only `golangci-lint fmt`
      # does. Without this step misformatted Go passes CI and is caught only
      # by a local `make fmt-check`.
      - run: golangci-lint fmt --diff ./... 2>&1 | diff /dev/null -

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npx oxlint
      - run: cd frontend && npx oxfmt --check .
      - run: cd frontend && npx tsc -b --noEmit

  lint-website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: cd website && npm ci
      - run: cd website && npx oxlint
      - run: cd website && npx oxfmt --check .

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm test -- --run

  sbom-sync:
    needs: build-frontend
    runs-on: ubuntu-latest
    # Keeps the committed SBOM current instead of asking the author to.
    #
    # On a pull request from this repository the regenerated artifacts are
    # committed back to the branch. That covers the three ways drift actually
    # happens: Dependabot cannot run `make sbom` at all, cyclonedx-gomod cannot
    # run in a linked worktree (so the pre-commit hook skips there), and people
    # forget. A fork PR gets a read-only token and so cannot be written to; it
    # reports drift without failing, and the push-to-main run below is the
    # backstop that keeps the default branch honest.
    permissions:
      contents: write
    # One sync per branch: two concurrent runs would race the same commit.
    concurrency:
      group: sbom-sync-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull_request checkout is a detached merge commit by default, which
          # has no branch to commit onto. Check out the head itself.
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      # cyclonedx-gomod compiles the package, so main.go's //go:embed
      # frontend/dist/* needs the built frontend. Reuse the build-frontend
      # artifact rather than rebuilding it here.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: frontend
      - run: make sbom

      # Same-repo pull request: commit the result. createCommitOnBranch is used
      # rather than `git push` because GitHub signs commits authored through the
      # API, so the result is Verified with no signing key in CI secrets, and
      # because expectedHeadOid makes the write fail rather than clobber a
      # branch that moved since checkout.
      - name: Commit regenerated SBOM
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Via the environment, not interpolated into the script: a branch name
          # is attacker-controlled and would otherwise be a shell injection.
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/commit-sbom.sh "$HEAD_REF" "$HEAD_SHA"

      # Fork pull request: nothing can be written, so report and pass.
      - name: Report SBOM drift
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: |
          if ! make sbom-verify; then
            echo "::warning::SBOM is stale. A maintainer will regenerate it; fork PRs cannot be written to."
          fi

      # Push to main: the backstop. Nothing should be stale here, and CI must
      # never commit to the default branch, so this only fails.
      - name: Verify SBOM is current
        if: github.event_name != 'pull_request'
        run: |
          make sbom-verify
