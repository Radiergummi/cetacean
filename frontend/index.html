<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="./favicon.ico"
      sizes="32x32"
    />
    <link
      rel="icon"
      type="image/png"
      href="./favicon-32x32.png"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!--
      Lets the browser paint its canvas in the reader's preferred scheme before
      any stylesheet arrives, so "system" costs no flash at all.
    -->
    <meta
      name="color-scheme"
      content="light dark"
    />
    <title>Cetacean</title>
    <!-- Render-blocking on purpose: see public/assets/theme.js. -->
    <script src="./assets/theme.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
