# Cetacean on its own. Deploys with no prerequisites:
#
#   docker stack deploy -c compose.yaml cetacean
#
# To chart metrics, deploy compose.monitoring.yaml (which creates the
# `monitoring` overlay network) and add compose.prometheus.yaml on top:
#
#   docker stack deploy -c compose.monitoring.yaml monitoring
#   docker stack deploy -c compose.yaml -c compose.prometheus.yaml cetacean

services:
  cetacean:
    # Published on every release. Pin a version (…:0.13.0) rather than
    # tracking latest if you want deploys to be deliberate.
    image: ghcr.io/radiergummi/cetacean:latest
    ports:
      - published: 9000
        target: 9000
        protocol: tcp
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
      # CETACEAN_SNAPSHOT is on by default and writes to CETACEAN_DATA_DIR.
      # Without somewhere durable to put it the snapshot lands in the
      # container's own filesystem and dies with every task, taking the
      # restart-failure history with it — so a freshly-replaced Cetacean
      # reports a service that has been crash-looping for days as though the
      # fault began minutes ago.
      #
      # This volume is node-local, and the constraint below only pins the task
      # to *a* manager: on a swarm with more than one, a reschedule lands on a
      # different node and binds a fresh empty volume, losing exactly what the
      # volume was added to keep. Pin the task to one node instead —
      #
      #   constraints:
      #     - node.hostname == <your-manager>
      #
      # — or point this at a volume driver whose storage every manager shares.
      - type: volume
        source: cetacean_data
        target: /data
    environment:
      CETACEAN_DATA_DIR: /data
    deploy:
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M

volumes:
  cetacean_data:
